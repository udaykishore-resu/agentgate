apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entry point for rendering the unmodified base:
#
#   kustomize build --load-restrictor=LoadRestrictionsNone deploy/k8s
#
# Useful for reviewing what the overlays actually change:
#
#   diff <(kustomize build --load-restrictor=LoadRestrictionsNone deploy/k8s) \
#        <(kustomize build --load-restrictor=LoadRestrictionsNone deploy/k8s/overlays/prod)
#
# Deploy from an overlay, never from here — see deploy/k8s/base/kustomization.yaml.

resources:
  - base
