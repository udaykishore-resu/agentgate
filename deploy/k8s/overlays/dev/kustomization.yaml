apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# dev — a place to be wrong cheaply.
#
# What differs from the base, and why:
#   replicas            1 of everything. HA costs money and teaches nothing here.
#   content capture     `redacted` — developers need to see prompts to debug
#                       agents, and dev carries no production data.
#   guardrails          fail_open everywhere, so a guardrail restart does not
#                       block a developer at 17:00 on a Friday.
#   tail sampling       100% baseline. Volume is trivial and "find my trace"
#                       is the main use of the telemetry plane here.
#   image tag           floating `dev` tag, pulled Always.

namespace: agentgate

resources:
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/environment: dev

images:
  - name: ghcr.io/agentgate/gateway
    newTag: dev
  - name: ghcr.io/agentgate/controlplane
    newTag: dev
  - name: ghcr.io/agentgate/fleetview
    newTag: dev
  - name: ghcr.io/agentgate/guardrails
    newTag: dev

replicas:
  - name: gateway
    count: 1
  - name: controlplane
    count: 1
  - name: fleetview
    count: 1
  - name: guardrails
    count: 1
  - name: otel-collector-gateway
    count: 1

patches:
  - path: common-config.yaml
  - path: sampling.yaml

  # Floating tags need an unconditional pull, otherwise a node that already has
  # `dev` cached silently keeps running yesterday's build.
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=agentgate
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # HPAs off in dev: one replica is the answer regardless of load, and an HPA
  # fighting the replica count above produces confusing rollout behaviour.
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: selected-by-target-above

  # A single-replica deployment cannot satisfy a PDB, and a PDB that can never
  # be satisfied blocks every node drain in the cluster.
  - target:
      kind: PodDisruptionBudget
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: selected-by-target-above

  # Hard node anti-affinity cannot be met on a small dev cluster.
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=agentgate
    patch: |-
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/part-of: agentgate

  # Smaller footprint so a dev cluster can host several branches at once.
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi

  - target:
      kind: SecretStore
      name: azure-keyvault
    patch: |-
      - op: replace
        path: /spec/provider/azurekv/vaultUrl
        value: https://agentgate-kv-dev.vault.azure.net
