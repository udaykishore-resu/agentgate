# Secret material.
#
# No Secret object is committed to this repository and none is created by hand.
# Everything is pulled at runtime from the enterprise vault by the External
# Secrets Operator, authenticated with the same workload identity the workload
# itself uses. Two consequences worth being explicit about:
#
#   * A leaked manifest leaks nothing. The manifests name secrets; they never
#     contain them.
#   * Rotation is a vault operation. `refreshInterval` picks the new value up
#     without a deploy, and the 90-day client-secret rotation in SPEC §1.1
#     therefore needs no coordination with release trains.
#
# The Azure Key Vault and AWS Secrets Manager stores are both defined. A
# cluster uses one; the overlays remove the other.

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault
  namespace: agentgate
  labels:
    app.kubernetes.io/part-of: agentgate
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://agentgate-kv.vault.azure.net"
      serviceAccountRef:
        name: controlplane
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: agentgate
  labels:
    app.kubernetes.io/part-of: agentgate
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: controlplane
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: controlplane-secrets
  namespace: agentgate
  labels:
    app.kubernetes.io/name: controlplane
    app.kubernetes.io/part-of: agentgate
spec:
  # 15m: short enough that an emergency rotation propagates within a coffee
  # break, long enough not to hammer the vault from every replica.
  refreshInterval: 15m
  secretStoreRef:
    name: azure-keyvault
    kind: SecretStore
  target:
    name: controlplane-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: AGENTGATE_DB_DSN
      remoteRef:
        key: agentgate-controlplane-db-dsn
    - secretKey: signing.pem
      remoteRef:
        key: agentgate-token-signing-key
    - secretKey: AGENTGATE_SERVICENOW_TOKEN
      remoteRef:
        key: agentgate-servicenow-token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway-secrets
  namespace: agentgate
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: agentgate
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: azure-keyvault
    kind: SecretStore
  target:
    name: gateway-secrets
    creationPolicy: Owner
  data:
    # Redis auth. Note there is no provider API key here: the gateway
    # authenticates to Azure OpenAI and Bedrock with its own workload identity,
    # so no model-provider credential exists to leak.
    - secretKey: AGENTGATE_REDIS_PASSWORD
      remoteRef:
        key: agentgate-redis-password
    - secretKey: AGENTGATE_USAGE_STREAM_DSN
      remoteRef:
        key: agentgate-usage-stream-dsn
    - secretKey: onprem-ca.pem
      remoteRef:
        key: agentgate-onprem-ca-bundle
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fleetview-secrets
  namespace: agentgate
  labels:
    app.kubernetes.io/name: fleetview
    app.kubernetes.io/part-of: agentgate
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: azure-keyvault
    kind: SecretStore
  target:
    name: fleetview-secrets
    creationPolicy: Owner
  data:
    # A distinct, read-only database role. fleetview reads the registry to
    # render the fleet; it must never be able to write a promotion record.
    - secretKey: AGENTGATE_DB_DSN
      remoteRef:
        key: agentgate-fleetview-db-dsn
---
# Alternative to External Secrets on AKS: the Key Vault CSI driver, which
# projects secrets as files rather than as Kubernetes Secret objects. Preferred
# where the security review objects to secret material existing in etcd at all.
# Enabled by the `azure-csi` overlay component; harmless if the driver is not
# installed, because nothing references it unless the overlay adds the volume.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agentgate-keyvault
  namespace: agentgate
  labels:
    app.kubernetes.io/part-of: agentgate
spec:
  provider: azure
  parameters:
    clientID: "00000000-0000-0000-0000-000000000001"
    keyvaultName: "agentgate-kv"
    tenantId: "00000000-0000-0000-0000-000000000000"
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    objects: |
      array:
        - |
          objectName: agentgate-token-signing-key
          objectAlias: signing.pem
          objectType: secret
        - |
          objectName: agentgate-onprem-ca-bundle
          objectAlias: onprem-ca.pem
          objectType: secret
