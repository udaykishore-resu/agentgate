# ServiceAccounts.
#
# Workload identity is the whole point: no static cloud credential exists
# anywhere in this deployment. The ServiceAccount is the identity, the cloud
# trusts the cluster's OIDC issuer, and the token is projected and short-lived.
#
# Both cloud mappings are shown on every account. Pick one per cluster — the
# overlays patch in the correct annotation and remove the other. They are kept
# side by side here so the equivalence is visible: the Azure client id and the
# AWS role ARN are the same concept, and `deploy/terraform/{azure,aws}` create
# exactly these two objects.
#
#   Azure: azure.workload.identity/client-id  -> user-assigned managed identity
#          with a federated credential whose subject is
#          system:serviceaccount:agentgate:<name>
#   AWS:   eks.amazonaws.com/role-arn         -> IAM role whose trust policy
#          conditions on the same subject via the cluster OIDC provider
#
# automountServiceAccountToken is false everywhere. The projected token that
# workload identity needs is mounted explicitly by the webhook (Azure) or the
# EKS pod identity webhook (AWS); the default namespace token grants API access
# that none of these services need.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: agentgate
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: agentgate
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
    azure.workload.identity/tenant-id: "00000000-0000-0000-0000-000000000000"
    # AWS alternative — enabled by the `aws` overlay component:
    # eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/agentgate-gateway
    # eks.amazonaws.com/sts-regional-endpoints: "true"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controlplane
  namespace: agentgate
  labels:
    app.kubernetes.io/name: controlplane
    app.kubernetes.io/part-of: agentgate
  annotations:
    # This identity is the most privileged in the platform: it reads the
    # token-signing key and the database credential, and it is what a
    # compromised pod would be after. It is deliberately separate from the
    # gateway's identity so that a gateway compromise cannot mint tokens.
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000001"
    azure.workload.identity/tenant-id: "00000000-0000-0000-0000-000000000000"
    # eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/agentgate-controlplane
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetview
  namespace: agentgate
  labels:
    app.kubernetes.io/name: fleetview
    app.kubernetes.io/part-of: agentgate
  annotations:
    # Read-only against the database and Prometheus; no secret material.
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000002"
    azure.workload.identity/tenant-id: "00000000-0000-0000-0000-000000000000"
    # eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/agentgate-fleetview
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guardrails
  namespace: agentgate
  labels:
    app.kubernetes.io/name: guardrails
    app.kubernetes.io/part-of: agentgate
  annotations:
    # Needs an identity only when running in `callout` mode against a managed
    # content-safety service.
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000003"
    azure.workload.identity/tenant-id: "00000000-0000-0000-0000-000000000000"
    # eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/agentgate-guardrails
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: agentgate
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: agentgate
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000004"
    azure.workload.identity/tenant-id: "00000000-0000-0000-0000-000000000000"
    # eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/agentgate-otel-collector
# The one exception: the k8sattributes processor authenticates to the API
# server with this token, so it must be mounted.
automountServiceAccountToken: true
---
# RBAC for the k8sattributes processor. Read-only, cluster-scoped because pods
# on a node can belong to any namespace, and narrowed to exactly the three
# resource types the processor reads. It can enumerate pod metadata across the
# cluster, which is why it gets its own ServiceAccount rather than sharing one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentgate-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: agentgate
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["extensions"]
    resources: ["replicasets"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentgate-otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: agentgate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentgate-otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: agentgate
